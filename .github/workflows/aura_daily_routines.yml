name: AURA-OS Cloud Daily Routine Trigger

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST (Morning Intel Wakeup)
    - cron: '30 0 * * *'
    # 00:35 UTC = 06:05 AM IST (Workout Beast Mode)
    - cron: '35 0 * * *'
    # 01:30 UTC = 07:00 AM IST (SGC Month-End GST - Runs on 1st of month)
    - cron: '30 1 1 * *'
    # 16:30 UTC = 22:00 PM IST (Night Review & Retrospective)
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      routine_id:
        description: 'Routine to trigger (morning_wakeup, workout_beast, sgc_monthly_gst, night_wrapup)'
        required: true
        default: 'morning_wakeup'

jobs:
  trigger-routine:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Target Routine
        id: select-routine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ROUTINE="${{ github.event.inputs.routine_id }}"
            echo "Manual workflow_dispatch selected: $ROUTINE"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "routine=$ROUTINE" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            DAY=$(date -u +%d)
            echo "Current UTC Time: $HOUR:$MIN, Day: $DAY"

            if [ "$HOUR" = "00" ] && [ "$MIN" -ge "25" ] && [ "$MIN" -le "34" ]; then
              ROUTINE="morning_wakeup"
            elif [ "$HOUR" = "00" ] && [ "$MIN" -ge "35" ] && [ "$MIN" -le "50" ]; then
              ROUTINE="workout_beast"
            elif [ "$HOUR" = "01" ] && [ "$DAY" = "01" ]; then
              ROUTINE="sgc_monthly_gst"
            elif [ "$HOUR" = "16" ]; then
              ROUTINE="night_wrapup"
            else
              echo "⏭️ No scheduled routine matching current UTC time ($HOUR:$MIN). Skipping to avoid out-of-schedule triggers."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Selected Routine: $ROUTINE"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "routine=$ROUTINE" >> $GITHUB_OUTPUT
          fi

      - name: Dispatch Cloud Routine to Render
        if: steps.select-routine.outputs.skip != 'true'
        run: |
          ROUTINE="${{ steps.select-routine.outputs.routine }}"
          URL="https://aura-os-jarvis.onrender.com/api/v1/routines/trigger/${ROUTINE}?secret=mukil-aura-pc-bridge-secret-2026&force=false"
          echo "Dispatched trigger for '$ROUTINE' to $URL (force=false)"
          
          # Single request with wake-up fallback to prevent duplicate retry spam
          curl --max-time 60 -s -f -X POST "$URL" || {
            echo "Container may be asleep, waking up /health..."
            curl -s --max-time 20 "https://aura-os-jarvis.onrender.com/health"
            sleep 5
            curl -s -f -X POST "$URL" || echo "Routine already triggered or handled by Cloud engine."
          }
          echo "Trigger evaluation complete for: $ROUTINE"
