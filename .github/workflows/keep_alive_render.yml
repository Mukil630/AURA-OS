name: Render 24/7 Always Awake Keep-Alive

on:
  schedule:
    # Trigger every 5 minutes 24/7 (Render free-tier sleeps after 15 min inactivity)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health & Keep Container Awake
        run: |
          echo "Pinging AURA-OS Render Service to prevent cloud sleep..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://aura-os-jarvis.onrender.com/health")
          echo "Received HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "AURA-OS Render Container is LIVE and AWAKE 24/7!"
          else
            echo "Warning: Response status was $HTTP_STATUS, retrying wake-up call..."
            curl -f -s --max-time 45 "https://aura-os-jarvis.onrender.com/health" || true
          fi
