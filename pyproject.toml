[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mukil-master-agent"
version = "0.1.0"
description = "Cloud-First Agentic Operating System with Persistent Multi-Agent Workflows, Voice Control & Verification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mukil", email = "mukil@local" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.23",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "psutil>=5.9.0",
    "groq>=0.9.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
