[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mukil-master-agent"
version = "0.1.0"
description = "Cloud-First Agentic Operating System with Persistent Multi-Agent Workflows, Voice Control & Verification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mukil", email = "mukil@local" }
]
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
