<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA-OS — 3D Glassmorphism Animated Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00f2ff;
      --primary-glow: rgba(0, 242, 255, 0.4);
      --purple: #8a2be2;
      --purple-glow: rgba(138, 43, 226, 0.4);
      --bg: #070a13;
      --glass-bg: rgba(16, 24, 42, 0.65);
      --glass-border: rgba(0, 242, 255, 0.25);
      --text: #f0f6fc;
      --text-muted: #8b949e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* Floating Animated Mesh Spheres in Background */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: floatOrb 8s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 350px;
      height: 350px;
      background: linear-gradient(135deg, var(--primary), #0066ff);
      top: 10%;
      left: 15%;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, var(--purple), #ff007f);
      bottom: 10%;
      right: 15%;
      animation-duration: 10s;
      animation-delay: -3s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: #00ff88;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.3;
    }

    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-40px) scale(1.1); }
    }

    /* 3D Glassmorphic Card */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 242, 255, 0.15);
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .header-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: radial-gradient(circle, var(--primary) 10%, #0055cc 80%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 20px var(--primary-glow);
      border: 2px solid var(--primary);
    }

    .header-section h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--primary), #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header-section p {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      background: rgba(8, 14, 28, 0.7);
      border: 1px solid rgba(0, 242, 255, 0.2);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 16px var(--primary-glow);
      background: rgba(12, 20, 38, 0.85);
    }

    .input-field::placeholder {
      color: #566573;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--primary);
    }

    .extra-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      margin-bottom: 24px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .remember-me input {
      accent-color: var(--primary);
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), #0066ff);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 20px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--primary-glow);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .divider span {
      padding: 0 10px;
    }

    .oauth-buttons {
      display: flex;
      gap: 12px;
    }

    .oauth-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .oauth-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--primary);
    }

    .success-alert {
      display: none;
      margin-top: 18px;
      padding: 12px;
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid #00ff88;
      color: #00ff88;
      border-radius: 12px;
      font-size: 0.88rem;
      text-align: center;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Floating Glow Spheres -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Login Card -->
  <div class="login-container" id="card">
    <div class="header-section">
      <div class="logo-badge">⚡</div>
      <h1>AURA PORTAL</h1>
      <p>Mukil's Executive AI Gateway</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">EMAIL ADDRESS</label>
        <div class="input-wrapper">
          <input type="email" id="email" class="input-field" placeholder="mukilarasu55@gmail.com" required value="mukilarasu55@gmail.com">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">ACCESS PASSCODE</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="input-field" placeholder="••••••••••••" required value="AURA-STARK-55">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
        </div>
      </div>

      <div class="extra-row">
        <label class="remember-me">
          <input type="checkbox" checked>
          <span>Remember session</span>
        </label>
        <a href="#" class="forgot-link" onclick="alert('Passcode reset link dispatched to Telegram!')">Forgot Passcode?</a>
      </div>

      <button type="submit" class="btn-submit" id="btn-login">
        <span>AUTHORIZE & ENTER</span>
        <span>➔</span>
      </button>

      <div class="divider">
        <span>OR CONTINUE WITH</span>
      </div>

      <div class="oauth-buttons">
        <button type="button" class="oauth-btn" onclick="triggerOAuth('Google')">
          <span>🇬</span> Google
        </button>
        <button type="button" class="oauth-btn" onclick="triggerOAuth('GitHub')">
          <span>🐙</span> GitHub
        </button>
      </div>

      <div class="success-alert" id="success-box">
        ✅ <strong>Authorization Verified!</strong> Connecting to AURA Hub...
      </div>
    </form>
  </div>

  <script>
    // 3D Card Tilt Effect on Mouse Move
    const card = document.getElementById('card');
    document.addEventListener('mousemove', (e) => {
      if (window.innerWidth < 768) return; // Disable tilt on mobile
      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const box = document.getElementById('success-box');

      btn.innerText = "AUTHENTICATING...";
      btn.style.opacity = "0.8";

      setTimeout(() => {
        btn.innerText = "ACCESS GRANTED ⚡";
        box.style.display = "block";
        setTimeout(() => {
          window.location.href = "/app";
        }, 1200);
      }, 800);
    }

    function triggerOAuth(provider) {
      alert(`Connecting ${provider} OAuth for Mukil...`);
      setTimeout(() => {
        window.location.href = "/app";
      }, 500);
    }
  </script>
</body>
</html>
